<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — WEAPON</title>
    <style>
      :root {
        --bg: #050507;
        --fg: #f5f5f7;
        --muted: #8a8a94;
        --accent: #ff2b3a;
        --border: #232329;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .wrap { text-align: center; padding: 2rem; }
      .code { font-size: 6rem; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
      .msg { color: var(--muted); margin: 1rem 0 2rem; }
      a { color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 0.5rem 1.5rem; border-radius: 6px; transition: border-color 150ms; }
      a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">0x404</div>
      <p class="msg">Segment not found. The address you requested does not map to a valid page.</p>
      <p><a href="/weapon/">Return to base</a></p>
    </div>
  </body>
</html>
